
name: YouTube MP3 Downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: "変換する動画のURL"
        required: true
        type: string

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Deno JavaScript Runtime
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # FFmpeg
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # yt-dlp + EJS
      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "yt-dlp[default]"

      # Check dependencies
      - name: Check environment
        run: |
          deno --version
          ffmpeg -version
          yt-dlp --version

      # Create output directory
      - name: Create directories
        run: mkdir -p downloads

      # Download and convert
      - name: Convert authorized audio to MP3
        env:
          VIDEO_URL: ${{ inputs.url }}
        run: |
          yt-dlp \
            --no-playlist \
            --extract-audio \
            --audio-format mp3 \
            --audio-quality 0 \
            --js-runtimes deno \
            -o "downloads/%(title).200B.%(ext)s" \
            "$VIDEO_URL"

      # Verify output
      - name: Verify MP3
        run: |
          echo "Generated MP3 files:"
          find downloads -maxdepth 1 -type f -name '*.mp3' -print

          test -n "$(find downloads -maxdepth 1 -type f -name '*.mp3' -print -quit)"

      # Upload actual MP3 files
      - name: Upload MP3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MP3-Files
          path: downloads/*.mp3
          if-no-files-found: error
          retention-days: 7
