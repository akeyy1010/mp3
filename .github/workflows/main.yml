
name: Download MP3

on:
  workflow_dispatch:
    inputs:
      url:
        description: "ダウンロード対象のURL"
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade yt-dlp

      - name: Create download directory
        run: mkdir -p downloads

      - name: Download and convert to MP3
        env:
          VIDEO_URL: ${{ inputs.url }}
        run: |
          yt-dlp \
            --no-playlist \
            --extract-audio \
            --audio-format mp3 \
            --audio-quality 0 \
            -o "downloads/%(title).200B.%(ext)s" \
            "$VIDEO_URL"

      - name: Upload MP3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-mp3
          path: downloads/*.mp3
          if-no-files-found: error
          retention-days: 7
